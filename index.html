<style>
:root{
  --accent:#7c5cff; --accent2:#ff5c8a; --text:#fff; --muted:rgba(255,255,255,.62);
  --glass-bg:linear-gradient(145deg,rgba(255,255,255,.22),rgba(255,255,255,.06));
  --glass-border:rgba(255,255,255,.26);
  --glass-shadow:
    inset 0 1px 1px rgba(255,255,255,.6),
    inset 0 -1px 1px rgba(255,255,255,.12),
    inset 0 0 28px rgba(255,255,255,.06),
    0 26px 50px -14px rgba(0,0,0,.6),
    0 6px 16px rgba(0,0,0,.28);
  --grad:linear-gradient(135deg,rgba(124,92,255,.96),rgba(255,92,138,.96));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","SF Pro Display","Segoe UI",Roboto,sans-serif;
  background:#07070f;color:var(--text);overflow:hidden;
  user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased;
}

/* ---------- LIVING BACKDROP ---------- */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 0%,#120f2e 0%,#0a0a16 55%,#05050b 100%)}
.orb{position:absolute;border-radius:50%;will-change:transform,opacity;opacity:calc(.6 + var(--beat,0)*.55);scale:calc(1 + var(--beat,0)*.16)}
#beatBtn{margin-top:12px;padding:11px 20px;border-radius:999px;font-size:.92rem;font-weight:700;cursor:pointer;color:#fff;align-self:center}
#beatBtn.on{box-shadow:0 0 0 1.5px rgba(255,255,255,.5),0 0 22px rgba(124,92,255,.65)}
#beatBtn:active{transform:scale(.95)}
.o1{width:130vmax;height:130vmax;left:-55vmax;top:-45vmax;
  background:radial-gradient(circle,rgba(124,92,255,.5) 0%,rgba(124,92,255,0) 62%);
  animation:path1 38s ease-in-out infinite}
.o2{width:120vmax;height:120vmax;right:-55vmax;top:5vh;
  background:radial-gradient(circle,rgba(255,92,138,.42) 0%,rgba(255,92,138,0) 62%);
  animation:path2 46s ease-in-out infinite}
.o3{width:115vmax;height:115vmax;left:-40vmax;bottom:-55vmax;
  background:radial-gradient(circle,rgba(47,184,255,.4) 0%,rgba(47,184,255,0) 62%);
  animation:path3 54s ease-in-out infinite}
@keyframes path1{
  0%{transform:translate(0,0) scale(1)}
  25%{transform:translate(70vw,25vh) scale(1.15)}
  50%{transform:translate(55vw,85vh) scale(.9)}
  75%{transform:translate(-5vw,55vh) scale(1.1)}
  100%{transform:translate(0,0) scale(1)}}
@keyframes path2{
  0%{transform:translate(0,0) scale(1)}
  25%{transform:translate(-60vw,-30vh) scale(.9)}
  50%{transform:translate(-75vw,40vh) scale(1.15)}
  75%{transform:translate(-20vw,55vh) scale(1)}
  100%{transform:translate(0,0) scale(1)}}
@keyframes path3{
  0%{transform:translate(0,0) scale(1)}
  25%{transform:translate(55vw,-35vh) scale(1.12)}
  50%{transform:translate(85vw,-75vh) scale(.92)}
  75%{transform:translate(30vw,-40vh) scale(1.08)}
  100%{transform:translate(0,0) scale(1)}}

.screen{display:none;height:100vh;height:100dvh;flex-direction:column;position:relative;z-index:1;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.screen.active{display:flex}

/* ---------- LIQUID GLASS BASE ---------- */
.glass,.player-btn{
  position:relative;isolation:isolate;overflow:hidden;
  background:var(--glass-bg);background-origin:border-box;
  -webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  border:1px solid var(--glass-border);box-shadow:var(--glass-shadow);
  color:var(--text);font-family:inherit;
}
.glass::before,.player-btn::before,.pill.selected::before{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.34) 0%,rgba(255,255,255,.08) 38%,rgba(255,255,255,0) 55%);
}
.glass::after,.player-btn::after,.pill::after{
  content:"";position:absolute;inset:0;border-radius:inherit;z-index:-1;pointer-events:none;opacity:0;
  background:radial-gradient(circle at var(--px,50%) var(--py,50%),rgba(255,255,255,.45),rgba(255,255,255,0) 60%);
  transition:opacity .3s ease;
}
button.glass:active::after,.player-btn:active::after,.pill:active::after{opacity:1;transition:opacity .05s}

/* ---------- SETUP ---------- */
#setup{justify-content:center;align-items:center;padding:24px 20px;gap:22px;text-align:center}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px}
.logo-mark{width:132px;height:auto;display:block;filter:drop-shadow(0 6px 8px rgba(0,0,0,.65)) drop-shadow(0 16px 24px rgba(0,0,0,.5));animation:floaty 5s ease-in-out infinite}
@keyframes floaty{50%{transform:translateY(-6px)}}
.logo{font-size:2.3rem;font-weight:800;letter-spacing:.09em;
  background:linear-gradient(180deg,#fff 20%,#d8cdff 100%);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;filter:drop-shadow(0 4px 20px rgba(124,92,255,.7))}
.logo-sub{color:var(--muted);font-size:.98rem;letter-spacing:.02em}
.panel{width:100%;max-width:420px;border-radius:32px;padding:22px 18px;display:flex;flex-direction:column;gap:20px}
.setup-group{width:100%}
.setup-label{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin-bottom:10px;font-weight:600}
.pill-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.pill{
  position:relative;isolation:isolate;overflow:hidden;
  flex:1;min-width:48px;padding:14px 0;border-radius:17px;cursor:pointer;
  color:rgba(255,255,255,.85);font-family:inherit;font-size:1.1rem;font-weight:700;
  background:rgba(255,255,255,.07);background-origin:border-box;
  border:2px solid rgba(255,255,255,.10);
  box-shadow:inset 0 2px 6px rgba(0,0,0,.4),inset 0 -1px 0 rgba(255,255,255,.1);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,background .25s,color .2s;
}
.pill:active{transform:scale(.94)}
.pill.deck-pill{font-size:.95rem;min-width:90px}
.pill.selected{
  background:var(--grad);background-origin:border-box;color:#fff;
  border-color:rgba(255,255,255,.38);text-shadow:0 1px 3px rgba(0,0,0,.3);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -3px 8px rgba(0,0,0,.2),
    0 10px 22px -6px rgba(255,92,138,.55),0 4px 14px -2px rgba(124,92,255,.5);
  transform:translateY(-2px);
}
.pill.selected:active{transform:translateY(-1px) scale(.96)}
#startBtn{
  width:100%;max-width:420px;padding:19px;border-radius:24px;cursor:pointer;
  font-size:1.2rem;font-weight:800;letter-spacing:.05em;text-shadow:0 1px 4px rgba(0,0,0,.3);
  background:var(--grad);background-origin:border-box;border:2px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -6px 14px rgba(0,0,0,.18),
    0 20px 38px -10px rgba(255,92,138,.6),0 8px 22px -4px rgba(124,92,255,.5);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1);
}
#startBtn:active{transform:scale(.96)}

/* ---------- GAME ---------- */
.topbar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:14px 14px 0}
.topbar>:first-child{justify-self:start}.topbar>:last-child{justify-self:end}
.chip{display:inline-flex;align-items:center;padding:13px 20px;border-radius:99px;font-size:1rem;font-weight:700;
  color:rgba(255,255,255,.85);white-space:nowrap}
button.chip{cursor:pointer;transition:transform .15s}
button.chip:active{transform:scale(.93)}
.card-area{position:relative;z-index:5;flex:1;display:flex;justify-content:center;align-items:stretch;padding:14px 20px 40px;min-height:0}
.stack{position:relative;width:100%;max-width:480px;perspective:1100px}
.layer{position:absolute;inset:0;border-radius:32px;
  background:linear-gradient(145deg,rgba(255,255,255,.12),rgba(255,255,255,.03));
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.3),0 20px 40px -12px rgba(0,0,0,.55)}
.l1{transform:translateY(16px) scale(.95);opacity:.75;filter:brightness(.8);
  background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));
  border:1px solid var(--glass-border);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.15),
    inset 0 0 40px rgba(255,255,255,.06),0 30px 60px -16px rgba(0,0,0,.65),0 10px 24px rgba(124,92,255,.22)}
.next-inner{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;opacity:0}
.l2{transform:translateY(32px) scale(.90);opacity:.4}
.prompt-card{position:absolute;inset:0;border-radius:32px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:30px;text-align:center;
  background:linear-gradient(150deg,rgba(255,255,255,.26),rgba(255,255,255,.07) 55%,rgba(255,255,255,.12));
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -1px 1px rgba(255,255,255,.15),
    inset 0 0 40px rgba(255,255,255,.06),0 30px 60px -16px rgba(0,0,0,.65),0 10px 24px rgba(124,92,255,.22);
  animation:dealIn .45s cubic-bezier(.2,.9,.3,1.1)}
@keyframes dealIn{
  0%{opacity:0;transform:translateY(46px) scale(.92) rotateX(14deg)}
  55%{opacity:1}
  100%{opacity:1;transform:none}}
.card-eyebrow{font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;margin-bottom:16px;
  padding:6px 14px;border-radius:99px;background:rgba(0,0,0,.22);color:#ffd0df;
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.12)}
.card-text{font-size:clamp(1.5rem,6vw,2.15rem);font-weight:800;line-height:1.25;text-shadow:0 2px 16px rgba(0,0,0,.35)}
.card-note{position:absolute;right:-14px;bottom:-34px;font-size:10rem;line-height:1;opacity:.07;transform:rotate(-12deg);pointer-events:none}
.card-hint{position:absolute;bottom:16px;color:var(--muted);font-size:.74rem}
.players-area{padding:2px 14px 16px}
.players-grid{display:grid;gap:10px}
.player-btn{
  --rgb:124,92,255;
  border-radius:22px;padding:17px 8px;font-size:1.05rem;font-weight:800;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-shadow:0 1px 3px rgba(0,0,0,.35);
  background:linear-gradient(160deg,rgba(var(--rgb),.88),rgba(var(--rgb),.42));background-origin:border-box;
  border:1.5px solid rgba(255,255,255,.34);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -10px 18px rgba(0,0,0,.2),
    0 14px 26px -8px rgba(var(--rgb),.6),0 4px 10px rgba(0,0,0,.3);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),filter .15s;
}
.player-btn:active{transform:scale(.93);filter:brightness(1.15)}
.player-score{font-size:.8rem;font-weight:700;padding:3px 11px;border-radius:99px;background:rgba(0,0,0,.24);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.14)}
.player-btn.hit{animation:hit .46s cubic-bezier(.3,1.4,.5,1)}
@keyframes hit{
  0%{transform:scale(1)}
  35%{transform:scale(1.07);filter:brightness(1.4) saturate(1.2);
    box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -10px 18px rgba(255,255,255,.22),
      0 0 46px 6px rgba(var(--rgb),.95),0 0 0 3px rgba(255,255,255,.8)}
  100%{transform:scale(1)}}
.player-score{display:inline-flex;align-items:center;gap:6px}
.trophy-ico{width:15px;height:15px;flex:none;display:block;filter:drop-shadow(0 1px 1px rgba(0,0,0,.4))}
.trophy .trophy-ico{width:88px;height:88px}
.final-row span:last-child{display:inline-flex;align-items:center;gap:6px}
.player-score.bump{animation:bump .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- WINNER ---------- */
#winner{justify-content:center;align-items:center;padding:24px;gap:20px;text-align:center;overflow:hidden}
#winner>*:not(.confetti){position:relative;z-index:1}
.trophy{font-size:4.8rem;filter:drop-shadow(0 10px 30px rgba(255,200,80,.55));animation:trophyIn .8s cubic-bezier(.2,1.4,.4,1) both,floaty 3.5s ease-in-out .8s infinite}
#winnerName{font-size:2.1rem;font-weight:800;text-shadow:0 4px 24px rgba(124,92,255,.7)}
.winner-sub{color:var(--muted)}
#finalScores{border-radius:26px;padding:28px 30px;display:flex;flex-direction:column;gap:16px;font-size:1.05rem;width:100%;max-width:400px;box-sizing:border-box}
.final-row{display:flex;justify-content:space-between;gap:32px;font-weight:700}
.winner-buttons{display:flex;gap:12px;width:100%;max-width:400px}
.winner-buttons button{flex:1;padding:17px;border-radius:20px;font-size:1rem;font-weight:700;cursor:pointer;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.winner-buttons button:active{transform:scale(.95)}
#playAgainBtn{background:var(--grad);background-origin:border-box;border:2px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -5px 12px rgba(0,0,0,.18),0 14px 28px -8px rgba(255,92,138,.55)}
.confetti{position:fixed;left:0;top:0;pointer-events:none;will-change:transform,opacity;z-index:0}
#victory .confetti{z-index:1}

.home-logo{background:none;border:0;padding:0 6px;cursor:pointer;
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.home-logo svg{display:block;width:62px;height:auto;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.6)) drop-shadow(0 8px 14px rgba(0,0,0,.45))}
.home-logo:active{transform:scale(.9)}
.modal{display:none;position:fixed;inset:0;z-index:50;align-items:center;justify-content:center;padding:24px;
  background:rgba(5,5,12,.55);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.modal.show{display:flex;animation:fadeIn .2s ease}
@keyframes fadeIn{from{opacity:0}}
.dialog{position:relative;width:100%;max-width:340px;border-radius:30px;padding:34px 24px 24px;text-align:center;
  display:flex;flex-direction:column;gap:12px;animation:popIn .3s cubic-bezier(.2,1.2,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.88) translateY(14px)}}
.dialog-title{font-size:1.3rem;font-weight:800;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.dialog-text{color:var(--muted);font-size:.95rem;line-height:1.4;margin-bottom:10px}
.dialog-x{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  cursor:pointer;padding:0;transition:transform .15s}
.dialog-x:active{transform:scale(.88)}
.btn-grad{width:100%;padding:17px;border-radius:22px;cursor:pointer;font-size:1.05rem;font-weight:800;letter-spacing:.03em;
  text-shadow:0 1px 4px rgba(0,0,0,.3);color:#fff;
  background:var(--grad);background-origin:border-box;border:2px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.7),inset 0 -5px 12px rgba(0,0,0,.18),0 14px 28px -8px rgba(255,92,138,.55);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1)}
.btn-grad:active{transform:scale(.96)}

.stepper{display:flex;align-items:center;justify-content:center;gap:22px}
.step-btn{width:58px;height:58px;border-radius:19px;cursor:pointer;display:grid;place-items:center;
  font-size:1.9rem;font-weight:600;line-height:1;padding:0 0 3px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.3);
  background:var(--grad);background-origin:border-box;border:2px solid rgba(255,255,255,.38);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.65),inset 0 -3px 8px rgba(0,0,0,.2),
    0 10px 22px -6px rgba(255,92,138,.55),0 4px 14px -2px rgba(124,92,255,.5);
  transition:transform .18s cubic-bezier(.3,1.6,.5,1),opacity .2s,filter .2s}
.step-btn:active{transform:scale(.9)}
.step-btn:disabled{opacity:.35;filter:saturate(.3);box-shadow:inset 0 1px 1px rgba(255,255,255,.3);cursor:default;transform:none}
.step-val{min-width:92px;display:flex;flex-direction:column;align-items:center;line-height:1}
.step-val #plCount{font-size:2.5rem;font-weight:800;text-shadow:0 2px 14px rgba(124,92,255,.6)}
.step-unit{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:4px;font-weight:600}
.players-grid.compact{gap:8px}
.players-grid.compact .player-btn{padding:13px 3px;border-radius:18px;font-size:.95rem;gap:5px}
.players-grid.compact .player-score{font-size:.7rem;padding:2px 8px;white-space:nowrap}
.players-grid.compact .trophy-ico{display:none}
#finalScores.two-col{display:grid;grid-template-columns:1fr 1fr;column-gap:26px;row-gap:12px;min-width:0;padding:22px 20px}
#finalScores.two-col .final-row{gap:12px}
@media (max-height:720px){.trophy .trophy-ico{width:62px;height:62px}#winner{gap:14px}}
/* ---------- VICTORY SEQUENCE ---------- */
#victory{position:fixed;inset:0;z-index:60;display:none;overflow:hidden;cursor:pointer}
#victory.show{display:block}
#victory.out{animation:vOut .48s ease forwards;pointer-events:none}
@keyframes vOut{to{opacity:0}}
.v-dim{position:absolute;inset:0;background:radial-gradient(circle at 50% 50%,rgba(16,11,40,.5),rgba(4,4,10,.93));
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fadeIn .4s ease both}
.v-rays{position:absolute;left:50%;top:50%;width:170vmax;height:170vmax;margin:-85vmax 0 0 -85vmax;border-radius:50%;
  -webkit-mask-image:radial-gradient(circle closest-side,#000 0,rgba(0,0,0,.55) 28%,transparent 100%);
  mask-image:radial-gradient(circle closest-side,#000 0,rgba(0,0,0,.55) 28%,transparent 100%);
  animation:raysIn 1s cubic-bezier(.2,.8,.3,1) .15s both}
.v-rays::before{content:"";position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,rgba(var(--rgb),.42) 0 7deg,transparent 7deg 18deg);
  animation:spin 22s linear infinite}
@keyframes raysIn{from{opacity:0;transform:scale(.15)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
.v-box{position:fixed;margin:0;z-index:2;cursor:pointer;
  box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -10px 18px rgba(0,0,0,.2),
    0 0 40px 6px rgba(var(--rgb),.75),0 0 0 2px rgba(255,255,255,.55)}
.v-box.pulse{animation:vpulse 1.3s ease-in-out infinite}
@keyframes vpulse{50%{box-shadow:inset 0 1px 1px rgba(255,255,255,.9),inset 0 -10px 18px rgba(255,255,255,.2),
  0 0 70px 16px rgba(var(--rgb),.95),0 0 0 3px rgba(255,255,255,.9)}}
.v-box.compact{font-size:.95rem;padding:13px 3px;gap:5px}
.v-box.compact .player-score{font-size:.7rem;padding:2px 8px;white-space:nowrap}
.v-box.compact .trophy-ico{display:none}
.v-trophy{position:fixed;left:50%;width:104px;height:104px;margin-left:-52px;z-index:3;pointer-events:none;
  filter:drop-shadow(0 8px 26px rgba(255,200,80,.65)) drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.v-trophy .trophy-ico{width:104px;height:104px;animation:floaty 3s ease-in-out infinite}
.v-title{position:fixed;left:0;right:0;z-index:3;text-align:center;pointer-events:none;
  font-size:2.5rem;font-weight:800;letter-spacing:.12em;
  text-shadow:0 4px 30px rgba(var(--rgb),.95),0 2px 8px rgba(0,0,0,.55)}
.v-title span{display:inline-block}
#winner.active>*:not(.confetti):not(.trophy){animation:riseIn .6s cubic-bezier(.2,.9,.3,1.1) both}
#winner.active>#winnerName{animation-delay:.1s}
#winner.active>.winner-sub{animation-delay:.2s}
#winner.active>#finalScores{animation-delay:.3s}
#winner.active>.winner-buttons{animation-delay:.42s}
@keyframes riseIn{from{opacity:0;transform:translateY(26px) scale(.96)}}
@keyframes trophyIn{from{opacity:0;transform:scale(.2) rotate(-30deg)}}
@media (prefers-reduced-motion:reduce){
  .orb,.logo-mark,.trophy,.prompt-card{animation:none}
}
</style>
</head>
<body>
<div class="bg"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div></div>

<!-- SETUP -->
<div id="setup" class="screen active">
  <div class="brand">
    <svg class="logo-mark" viewBox="0 0 170 130" role="img" aria-label="Aux Battle"><defs><linearGradient id="barBlend" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="170" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#b86ad8"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs><g fill="url(#barBlend)" fill-opacity=".88"><rect x="0" y="48" width="10" height="34" rx="5"/><rect x="16" y="38" width="10" height="54" rx="5"/><rect x="32" y="28" width="10" height="74" rx="5"/><rect x="48" y="18" width="10" height="94" rx="5"/><rect x="64" y="8" width="10" height="114" rx="5"/><rect x="80" y="0" width="10" height="130" rx="5" fill="#fff" fill-opacity="1"/><rect x="96" y="8" width="10" height="114" rx="5"/><rect x="112" y="18" width="10" height="94" rx="5"/><rect x="128" y="28" width="10" height="74" rx="5"/><rect x="144" y="38" width="10" height="54" rx="5"/><rect x="160" y="48" width="10" height="34" rx="5"/></g></svg>
    <div class="logo">AUX BATTLE</div>
    <div class="logo-sub">May the best song win.</div>
  </div>

  <div class="panel glass">
    <div class="setup-group">
      <div class="setup-label">Players</div>
      <div class="stepper">
        <button id="plMinus" class="glass step-btn" aria-label="Fewer players">&minus;</button>
        <div class="step-val"><span id="plCount">4</span></div>
        <button id="plPlus" class="glass step-btn" aria-label="More players">+</button>
      </div>
    </div>
    <div class="setup-group">
      <div class="setup-label">Cards to Win</div>
      <div class="pill-row" id="winPills"></div>
    </div>
    <div class="setup-group">
      <div class="setup-label">Deck</div>
      <div class="pill-row" id="deckPills">
        <button class="pill deck-pill selected" data-deck="family">Family</button>
        <button class="pill deck-pill" data-deck="mix">Mix</button>
        <button class="pill deck-pill" data-deck="adult">Adult</button>
      </div>
    </div>
  </div>

  <button id="startBtn" class="glass">Start Game</button>
  <button id="beatBtn" class="glass">Beat-reactive background: Off</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="topbar">
    <span id="deckStatus" class="glass chip"></span>
    <button id="homeBtn" class="home-logo" aria-label="Return to home screen"><svg viewBox="0 0 170 130" aria-hidden="true"><defs><linearGradient id="barBlendGame" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="170" y2="0"><stop offset="0" stop-color="#7c5cff"/><stop offset=".5" stop-color="#b86ad8"/><stop offset="1" stop-color="#ff5c8a"/></linearGradient></defs><g fill="url(#barBlendGame)" fill-opacity=".88"><rect x="0" y="48" width="10" height="34" rx="5"/><rect x="16" y="38" width="10" height="54" rx="5"/><rect x="32" y="28" width="10" height="74" rx="5"/><rect x="48" y="18" width="10" height="94" rx="5"/><rect x="64" y="8" width="10" height="114" rx="5"/><rect x="80" y="0" width="10" height="130" rx="5" fill="#fff" fill-opacity="1"/><rect x="96" y="8" width="10" height="114" rx="5"/><rect x="112" y="18" width="10" height="94" rx="5"/><rect x="128" y="28" width="10" height="74" rx="5"/><rect x="144" y="38" width="10" height="54" rx="5"/><rect x="160" y="48" width="10" height="34" rx="5"/></g></svg></button>
    <button id="skipBtn" class="glass chip">Skip card</button>
  </div>
  <div class="card-area">
    <div class="stack">
      <div class="layer l2"></div>
      <div class="layer l1 glass">
        <div class="next-inner" id="nextInner">
          <div class="card-note">&#9835;</div>
          <div class="card-eyebrow">Play a song...</div>
          <div class="card-text" id="nextText"></div>
          <div class="card-hint">Tap the winner below to deal the next card</div>
        </div>
      </div>
      <div class="prompt-card glass">
        <div class="card-note">&#9835;</div>
        <div class="card-eyebrow">Play a song...</div>
        <div class="card-text" id="cardText"></div>
        <div class="card-hint">Tap the winner below to deal the next card</div>
      </div>
    </div>
  </div>
  <div class="players-area">
    <div class="players-grid" id="playersGrid"></div>
  </div>
</div>

<!-- WINNER -->
<div id="winner" class="screen">
  <div class="trophy"><svg class="trophy-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5H4.2v1.8A3.2 3.2 0 0 0 7.4 10" fill="none" stroke="#f0b429" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 5h2.8v1.8a3.2 3.2 0 0 1-3.2 3.2" fill="none" stroke="#f0b429" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 3h10v6.2a5 5 0 0 1-10 0z" fill="#ffd45e"/><path d="M12 3h5v6.2a5 5 0 0 1-5 5z" fill="#f5b83a"/><path d="M9.2 5.4v3.6" stroke="#fff" stroke-opacity=".7" stroke-width="1.5" stroke-linecap="round"/><rect x="10.9" y="14" width="2.2" height="3.6" fill="#e09f1f"/><rect x="7.8" y="17.4" width="8.4" height="3.4" rx="1.2" fill="#ffd45e"/><rect x="7.8" y="19.2" width="8.4" height="1.6" rx=".8" fill="#e09f1f"/></svg></div>
  <div id="winnerName"></div>
  <div class="winner-sub">takes the crown!</div>
  <div id="finalScores" class="glass"></div>
  <div class="winner-buttons">
    <button id="playAgainBtn" class="glass">Play Again</button>
    <button id="newGameBtn" class="glass">New Setup</button>
  </div>
</div>

<div id="victory"></div>

<!-- CONFIRM -->
<div id="confirmModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="dialog glass">
    <button id="confirmClose" class="dialog-x glass" aria-label="Close">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div id="confirmTitle" class="dialog-title">Return to home screen?</div>
    <div class="dialog-text">Your current game and scores will be reset.</div>
    <button id="confirmYes" class="glass btn-grad">Yes, I'm sure</button>
  </div>
</div>

<script>
// ============ PROMPT DECKS (original prompts) ============
const FAMILY_PROMPTS = [
  "...that instantly puts you in a good mood",
  "...for the opening scene of a summer road trip movie",
  "...that everyone in the car knows the words to",
  "...that would play while a superhero suits up",
  "...for dancing badly in the kitchen",
  "...that sounds like sunshine",
  "...you'd blast with the windows down",
  "...that belongs in a video game boss fight",
  "...for the last day of school",
  "...that would wake you up better than an alarm",
  "...you'd want playing when you walk into a room",
  "...that makes you feel like the main character",
  "...for a slow-motion walk away from an explosion",
  "...that a grandma and a teenager would both love",

  numPlayers: 4,
  cardsToWin: 5,
  deck: "family",

  drawPile: [],
  currentCard: null,

const PLAYER_COLORS = ["#7c5cff", "#ff5c8a", "#2ecc71", "#f39c12", "#3498db", "#e74c3c", "#f1c40f", "#d94ad6", "#00bebe", "#aab4c8"];

function scoreHTML(s) { return `${s}/${state.cardsToWin} ${TROPHY}`; }
const PLAYER_RGB = ["124,92,255", "255,92,138", "46,204,113", "243,156,18", "52,152,219", "231,76,60", "241,196,15", "217,74,214", "0,190,190", "170,180,200"];

// ============ SETUP UI ============
const plCount = document.getElementById("plCount");
const plMinus = document.getElementById("plMinus");

function setPlayers(n) {
  state.numPlayers = Math.max(2, Math.min(10, n));
  plCount.textContent = state.numPlayers;
  plMinus.disabled = state.numPlayers <= 2;
  plPlus.disabled = state.numPlayers >= 10;
}
plMinus.onclick = () => setPlayers(state.numPlayers - 1);
plPlus.onclick = () => setPlayers(state.numPlayers + 1);
setPlayers(state.numPlayers);

const winPills = document.getElementById("winPills");
[3, 5, 7, 10].forEach(n => {
  const b = document.createElement("button");
  b.className = "pill" + (n === state.cardsToWin ? " selected" : "");
  b.textContent = n;
  b.onclick = () => {
    state.cardsToWin = n;
    [...winPills.children].forEach(c => c.classList.toggle("selected", +c.textContent === n));
  };
  winPills.appendChild(b);
});

document.getElementById("deckPills").addEventListener("click", e => {
  const btn = e.target.closest("[data-deck]");

  [...document.querySelectorAll("#deckPills .pill")].forEach(c =>
    c.classList.toggle("selected", c === btn));

// ============ GAME LOGIC ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  if (state.deck === "family") return shuffle(FAMILY_PROMPTS);
  if (state.deck === "adult") return shuffle(ADULT_PROMPTS);
  return shuffle([...FAMILY_PROMPTS, ...ADULT_PROMPTS]);
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startGame() {
  state.scores = Array(state.numPlayers).fill(0);
  state.drawPile = buildDeck();
  buildPlayerButtons();
  nextCard();
  showScreen("game");
}

function nextCard(promoted) {
  if (state.drawPile.length === 0) state.drawPile = buildDeck();
  state.currentCard = state.drawPile.pop();
  const cardEl = document.querySelector(".prompt-card");
  cardEl.style.animation = "none";
  void cardEl.offsetWidth; // restart animation
  cardEl.style.animation = promoted ? "none" : "";
  document.getElementById("cardText").textContent = state.currentCard;
  document.getElementById("deckStatus").textContent = state.drawPile.length + " cards left";
}

function buildPlayerButtons() {
  const grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  grid.classList.toggle("compact", state.numPlayers >= 9);
  grid.style.gridTemplateColumns = state.numPlayers <= 3 ? `repeat(${state.numPlayers}, 1fr)` : `repeat(${Math.ceil(state.numPlayers / 2)}, 1fr)`;
  for (let i = 0; i < state.numPlayers; i++) {
    const b = document.createElement("button");
    b.className = "player-btn";
    b.style.setProperty('--rgb', PLAYER_RGB[i]);
    b.innerHTML = `<span>${state.numPlayers >= 9 ? "P" : "Player "}${i + 1}</span><span class="player-score" id="score-${i}">${scoreHTML(state.scores[i])}</span>`;
    b.onclick = () => awardRound(i);
    grid.appendChild(b);
  }
}

let busy = false;

// bump the score and report whether this player just hit the target
function scoreFor(i) {
  state.scores[i]++;
  const sc = document.getElementById("score-" + i);
  sc.innerHTML = scoreHTML(state.scores[i]);
  sc.classList.remove("bump"); void sc.offsetWidth; sc.classList.add("bump");
  return state.scores[i] >= state.cardsToWin;
}

// instant version (no animation)
function finishRound(i) {
  if (scoreFor(i)) showWinner(i); else nextCard();
}

// ---------- confetti ----------
const CONF = ["#ffd45e", "#ffffff", "#ff5c8a", "#7c5cff", "#2fb8ff", "#2ecc71", "#f39c12"];
const rnd = (a, b) => a + Math.random() * (b - a);

// a random bit of confetti: rectangle, dot, or thin streamer, in a random size and color
function mkPiece(host, extra) {
  const p = document.createElement("div");
  p.className = "confetti";
  const size = rnd(5, 14), k = Math.random();
  let w = size, h = size * 1.5, br = "2px";
  if (k < .25) { h = w; br = "50%"; }
  else if (k < .42) { w = 3.5; h = size * 2.6; }
  p.style.width = w + "px"; p.style.height = h + "px"; p.style.borderRadius = br;
  const pool = extra ? CONF.concat(extra, extra) : CONF;
  p.style.background = pool[Math.floor(Math.random() * pool.length)];
  host.appendChild(p);
  return p;
}

// drifts down the screen at its own speed, swaying side to side
function fieldPiece(host, o) {
  const p = mkPiece(host, o.extra);
  const H = innerHeight, dist = H + 60 - o.y0, dur = dist / o.speed;
  const sw = rnd(18, 75), ph = rnd(0, 6.28), rate = rnd(.7, 1.6), N = 8;
  const rx = rnd(-1, 1) * rnd(360, 1080), rz = rnd(-1, 1) * rnd(180, 720), frames = [];
  for (let j = 0; j <= N; j++) {
    const f = j / N;
    frames.push({
      transform: `translate(${o.x + Math.sin(ph + j * rate) * sw}px,${o.y0 + dist * f}px) rotateX(${rx * f}deg) rotateZ(${rz * f}deg)`,
      opacity: j === 0 ? 0 : 1
    });
  }
  p.animate(frames, { duration: dur * 1000, delay: (o.delay || 0) * 1000, easing: "linear", fill: "both" })
    .onfinish = () => p.remove();
}

// the winner's box lifts out of the grid, flies to center, and the room erupts
function victory(i, btn, cleanup) {
  const v = document.getElementById("victory");
  const rgb = PLAYER_RGB[i];
  const vw = innerWidth, vh = innerHeight;
  const b = btn.getBoundingClientRect();
  const s = Math.min(Math.min(vw * 0.62, 300) / b.width, Math.min(vh * 0.2, 150) / b.height, 3);
  const cx = vw / 2, cy = vh / 2 + 28;
  const dx = cx - (b.left + b.width / 2), dy = cy - (b.top + b.height / 2);
  const boxH = b.height * s;
  const t0 = performance.now();
  const timers = [];
  const later = (fn, ms) => timers.push(setTimeout(fn, ms));
  let done = false;

  v.style.setProperty("--rgb", rgb);
  v.innerHTML = '<div class="v-dim"></div><div class="v-rays"></div>';
  v.classList.add("show");

  const box = btn.cloneNode(true);
  box.removeAttribute("id");
  box.querySelectorAll("[id]").forEach(e => e.removeAttribute("id"));
  box.className = "player-btn v-box" + (state.numPlayers >= 9 ? " compact" : "");
  Object.assign(box.style, { left: b.left + "px", top: b.top + "px", width: b.width + "px", height: b.height + "px" });
  v.appendChild(box);
  btn.style.visibility = "hidden";

  const lift = box.animate([
    { transform: "translate(0,0) scale(1) rotate(0deg)", offset: 0, easing: "cubic-bezier(.3,0,.2,1)" },
    { transform: `translate(${dx * .45}px,${dy * .45 - 70}px) scale(${1 + (s - 1) * .55}) rotate(-7deg)`, offset: .42, easing: "cubic-bezier(.3,0,.2,1)" },
    { transform: `translate(${dx}px,${dy}px) scale(${s * 1.12}) rotate(3deg)`, offset: .8, easing: "ease-out" },
    { transform: `translate(${dx}px,${dy}px) scale(${s}) rotate(0deg)`, offset: 1 }
  ], { duration: 950, fill: "forwards" });
  lift.onfinish = () => box.classList.add("pulse");

  const extra = `rgb(${rgb})`;
  const W = vw;

  later(() => {
    const tr = document.createElement("div");
    tr.className = "v-trophy";
    tr.innerHTML = TROPHY;
    tr.style.top = (cy - boxH / 2 - 14 - 104) + "px";
    v.appendChild(tr);
    tr.animate([
      { opacity: 0, transform: "translateY(-280px) scale(.3) rotate(-25deg)" },
      { opacity: 1, transform: "translateY(14px) scale(1.3) rotate(10deg)", offset: .6 },
      { opacity: 1, transform: "translateY(0) scale(1) rotate(0deg)" }
    ], { duration: 760, easing: "cubic-bezier(.3,.8,.3,1)", fill: "both" });
  }, 780);

  later(() => {
    const title = document.createElement("div");
    title.className = "v-title";
    title.style.top = (cy + boxH / 2 + 16) + "px";
    "WINNER!".split("").forEach((ch, k) => {
      const sp = document.createElement("span");
      sp.textContent = ch;
      title.appendChild(sp);
      sp.animate([
        { opacity: 0, transform: "translateY(34px) scale(.4)" },
        { opacity: 1, transform: "translateY(-6px) scale(1.25)", offset: .65 },
        { opacity: 1, transform: "none" }
      ], { duration: 420, delay: k * 70, easing: "ease-out", fill: "both" });
    });
    v.appendChild(title);
  }, 950);

  // everything just falls: an opening shower as the trophy lands, then a steady rain, all across the width
  const rain = (n, from, to) => { for (let k = 0; k < n; k++) later(() => fieldPiece(v, {
    x: rnd(0, W), y0: rnd(-120, -20), speed: rnd(300, 800), extra
  }), rnd(from, to)); };
  rain(60, 780, 1150);
  rain(110, 1150, 1700);

  const finish = () => {
    if (done) return;
    done = true;
    timers.forEach(clearTimeout);
    showWinner(i);
    if (cleanup) cleanup();
    btn.style.visibility = "";
    v.classList.add("out");
    setTimeout(() => {
      v.classList.remove("show", "out");
      v.innerHTML = "";
      v.onclick = null;
      busy = false;
    }, 500);
  };
  later(finish, 2000);
  v.onclick = finish;
}

// card floats up, shrinks, and flies into the winning player's box
function awardRound(i) {
  if (busy) return;
  const card = document.querySelector(".prompt-card");
  const btn = document.querySelectorAll(".player-btn")[i];
  if (!card || !btn || !card.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) {
    finishRound(i); return;
  }
  busy = true;
  const c = card.getBoundingClientRect(), b = btn.getBoundingClientRect();
  const dx = (b.left + b.width / 2) - (c.left + c.width / 2);
  const dy = (b.top + b.height / 2) - (c.top + c.height / 2);
  const s = Math.min(b.width / c.width, b.height / c.height) * 0.5;
  // reveal the next card in the stack and slide the stack forward
  if (state.drawPile.length === 0) state.drawPile = buildDeck();
  document.getElementById("nextText").textContent = state.drawPile[state.drawPile.length - 1];
  const ease = "cubic-bezier(.2,.8,.3,1)";
  const promo = [
    document.querySelector(".layer.l1").animate(
      [{ transform: "translateY(16px) scale(.95)", opacity: .75 },
       { transform: "none", opacity: 1 }],
      { duration: 460, delay: 90, easing: ease, fill: "both" }),
    // stays dark while the old card is still big, then quickly fades up as it shrinks away
    document.querySelector(".layer.l1").animate(
      [{ filter: "brightness(.45)" }, { filter: "brightness(1)" }],
      { duration: 240, delay: 340, easing: "ease-out", fill: "both" }),
    document.querySelector(".layer.l2").animate(
      [{ transform: "translateY(32px) scale(.9)", opacity: .4 },
       { transform: "translateY(16px) scale(.95)", opacity: .75 }],
      { duration: 460, delay: 90, easing: ease, fill: "both" }),
    document.getElementById("nextInner").animate(
      [{ opacity: 0 }, { opacity: 1 }],
      { duration: 240, delay: 110, fill: "both" })
  ];
  const fly = card.animate([
    { transform: "translate(0,0) scale(1)", opacity: 1, offset: 0, easing: "cubic-bezier(.2,.8,.3,1)" },
    { transform: "translate(0,-34px) scale(1.04)", opacity: 1, offset: 0.34, easing: "cubic-bezier(.65,0,.25,1)" },
    { transform: `translate(${dx}px,${dy}px) scale(${s})`, opacity: 0.9, offset: 0.93, easing: "ease-out" },
    { transform: `translate(${dx}px,${dy}px) scale(${s * 0.85})`, opacity: 0, offset: 1 }
  ], { duration: 600, fill: "forwards" });
  fly.onfinish = () => {
    const won = scoreFor(i);
    btn.classList.add("hit");
    setTimeout(() => {
      btn.classList.remove("hit");
      if (won) {
        victory(i, btn, () => { fly.cancel(); promo.forEach(a => a.cancel()); });
      } else {
        fly.cancel();
        promo.forEach(a => a.cancel());
        busy = false;
        nextCard(true);
      }
    }, 460);
  };
}

// skipped card: wind up, get flicked off to a random side with a spin and a SKIP stamp; next card slides forward
function skipCard() {
  const card = document.querySelector(".prompt-card");
  const btn = document.getElementById("skipBtn");
  if (!card || !card.animate || matchMedia("(prefers-reduced-motion: reduce)").matches) { nextCard(); return; }
  busy = true;
  const dir = Math.random() < .5 ? -1 : 1;   // -1: stamp high-left/low-right, card exits left; +1: mirrored, exits right
  const vw = innerWidth, vh = innerHeight;
  btn.animate([{ transform: "scale(1)" }, { transform: "scale(.82) rotate(" + (-6 * dir) + "deg)", offset: .3 }, { transform: "scale(1.12)", offset: .65 }, { transform: "scale(1)" }], { duration: 420, easing: "ease-out" });
  if (state.drawPile.length === 0) state.drawPile = buildDeck();
  document.getElementById("nextText").textContent = state.drawPile[state.drawPile.length - 1];
  const stamp = document.createElement("div");
  stamp.textContent = "SKIP";
  const cw = card.offsetWidth;
  stamp.style.cssText = `position:absolute;left:5%;right:5%;top:50%;transform-origin:center;text-align:center;font-weight:900;font-size:${(cw * .29).toFixed(0)}px;line-height:1;letter-spacing:.06em;color:#fff;` +
    `margin-top:-${(cw * .17).toFixed(0)}px;border:${Math.max(6, cw * .02).toFixed(0)}px solid #fff;border-radius:${(cw * .06).toFixed(0)}px;padding:${(cw * .03).toFixed(0)}px 0;` +
    "text-shadow:0 6px 24px rgba(0,0,0,.5);box-shadow:0 0 36px rgba(255,255,255,.55);background:rgba(255,255,255,.12);pointer-events:none;z-index:3";
  card.appendChild(stamp);
  stamp.animate([
    { opacity: 0, transform: `rotate(${-18 * dir}deg) scale(2.2)` },
    { opacity: 1, transform: `rotate(${-9 * dir}deg) scale(.92)`, offset: .35 },
    { opacity: 1, transform: `rotate(${-9 * dir}deg) scale(1)`, offset: .8 },
    { opacity: 0, transform: `rotate(${-9 * dir}deg) scale(1.05)` }
  ], { duration: 560, easing: "ease-out", fill: "both" });
  const ease = "cubic-bezier(.2,.8,.3,1)";
  const promo = [
    document.querySelector(".layer.l1").animate([{ transform: "translateY(16px) scale(.95)", opacity: .75 }, { transform: "none", opacity: 1 }], { duration: 460, delay: 140, easing: ease, fill: "both" }),
    document.querySelector(".layer.l1").animate([{ filter: "brightness(.45)" }, { filter: "brightness(1)" }], { duration: 240, delay: 320, easing: "ease-out", fill: "both" }),
    document.querySelector(".layer.l2").animate([{ transform: "translateY(32px) scale(.9)", opacity: .4 }, { transform: "translateY(16px) scale(.95)", opacity: .75 }], { duration: 460, delay: 140, easing: ease, fill: "both" }),
    document.getElementById("nextInner").animate([{ opacity: 0 }, { opacity: 1 }], { duration: 240, delay: 160, fill: "both" })
  ];
  const fly = card.animate([
    { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1, offset: 0, easing: "ease-out" },
    { transform: `translate(${-26 * dir}px,6px) rotate(${5 * dir}deg) scale(.97)`, opacity: 1, offset: .2, easing: "cubic-bezier(.5,0,.9,.4)" },
    { transform: `translate(${dir * vw * .9}px,${-vh * .14}px) rotate(${-dir * 30}deg) scale(.85)`, opacity: 1, offset: .85, easing: "linear" },
    { transform: `translate(${dir * vw * 1.1}px,${-vh * .18}px) rotate(${-dir * 40}deg) scale(.8)`, opacity: 0, offset: 1 }
  ], { duration: 640, fill: "forwards" });
  fly.onfinish = () => {
    stamp.remove();
    fly.cancel();
    promo.forEach(a => a.cancel());
    busy = false;
    nextCard(true);
  };
}

function showWinner(playerIdx) {
  document.getElementById("winnerName").textContent = "Player " + (playerIdx + 1);
  const scoresEl = document.getElementById("finalScores");
  scoresEl.classList.toggle("two-col", state.numPlayers > 6);
  scoresEl.innerHTML = state.scores
    .map((s, i) => ({ s, i }))
    .sort((a, b) => b.s - a.s)
    .map(({ s, i }) => `<div class="final-row"><span style="color:#fff">Player ${i + 1}</span><span>${scoreHTML(s)}</span></div>`)
    .join("");
  showScreen("winner");
  launchConfetti(playerIdx);
}

function launchConfetti(idx) {
  const host = document.getElementById("winner");
  const extra = idx != null ? `rgb(${PLAYER_RGB[idx]})` : null;
  const W = innerWidth;
  const alive = () => host.classList.contains("active");
  // everything falls from the top edge, each piece on its own schedule and at its own speed
  const H = innerHeight + 180, vmin = H / (H / 280 - 1.3);   // slowest piece now crosses 1.3s quicker
  for (let k = 0; k < 110; k++) setTimeout(() => {
    if (alive()) fieldPiece(host, { x: rnd(0, W), y0: rnd(-120, -20), speed: rnd(vmin, vmin * 2), extra });
  }, k < 60 ? rnd(0, 350) : rnd(350, 800));
}

// light-catch highlight follows your finger on glass buttons
document.addEventListener("pointerdown", e => {
  const el = e.target.closest("button.glass, .pill, .player-btn");
  if (!el) return;
  const r = el.getBoundingClientRect();
  el.style.setProperty("--px", ((e.clientX - r.left) / r.width * 100) + "%");
  el.style.setProperty("--py", ((e.clientY - r.top) / r.height * 100) + "%");
});

// ---- beat-reactive backdrop: listens through the mic, pulses the glow to bass hits ----
(function () {
  const btn = document.getElementById("beatBtn");
  const root = document.documentElement;
  let ctx, analyser, stream, raf = 0, data, avg = 0, env = 0, on = false;
  const label = t => { btn.textContent = "Beat-reactive background: " + t; };
  function tick() {
    analyser.getByteFrequencyData(data);
    let e = 0; const n = 8;                      // low bins ≈ kick / bass
    for (let k = 1; k <= n; k++) e += data[k];
    e /= n * 255;
    avg += (e - avg) * 0.04;                     // slow running average
    const hit = Math.max(0, (e - avg * 1.08) / (avg * 0.5 + 0.04));
    env = Math.max(env * 0.86, Math.min(1, hit));
    root.style.setProperty("--beat", env.toFixed(3));
    raf = requestAnimationFrame(tick);
  }
  async function start() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      ctx = new (window.AudioContext || window.webkitAudioContext)();
      await ctx.resume();
      analyser = ctx.createAnalyser();
      analyser.fftSize = 512; analyser.smoothingTimeConstant = 0.4;
      ctx.createMediaStreamSource(stream).connect(analyser);
      data = new Uint8Array(analyser.frequencyBinCount);
      on = true; btn.classList.add("on"); label("On"); tick();
    } catch (err) { label("mic blocked"); on = false; }
  }
  function stop() {
    cancelAnimationFrame(raf);
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ctx) ctx.close();
    root.style.removeProperty("--beat");
    on = false; btn.classList.remove("on"); label("Off");
  }
  btn.onclick = () => (on ? stop() : start());
})();
