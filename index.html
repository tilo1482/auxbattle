<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AUX BATTLE">
<meta name="theme-color" content="#0f1117">
<style>
  :root {
    --bg: #0f1117;
    --card-bg: #1c2030;
    --accent: #7c5cff;
    --accent2: #ff5c8a;
    --text: #f2f3f7;
    --muted: #9aa0b4;
    --green: #2ecc71;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }
  .screen {
    display: none;
    height: 100vh;
    height: 100dvh;
    flex-direction: column;
  }
  .screen.active { display: flex; }

  /* ---------- SETUP SCREEN ---------- */
  #setup {
    justify-content: center;
    align-items: center;
    padding: 24px;
    gap: 28px;
    text-align: center;
  }
  .logo {
    font-size: 2.2rem;
    font-weight: 800;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .logo-sub { color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
  .setup-group { width: 100%; max-width: 400px; }
  .setup-label {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .pill-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .pill {
    flex: 1;
    min-width: 48px;
    padding: 14px 0;
    border-radius: 14px;
    background: var(--card-bg);
    border: 2px solid transparent;
    color: var(--text);
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.15s;
  }
  .pill.selected {
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    background-origin: border-box;
    border-color: rgba(255, 255, 255, 0.35);
    color: white;
  }
  .pill.deck-pill { font-size: 0.95rem; min-width: 90px; }
  #startBtn {
    width: 100%;
    max-width: 400px;
    padding: 18px;
    border: 2px solid rgba(255, 255, 255, 0.35);
    border-radius: 16px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    background-origin: border-box;
    color: white;
    font-size: 1.25rem;
    font-weight: 800;
    cursor: pointer;
  }
  #startBtn:active { transform: scale(0.97); }

  /* ---------- GAME SCREEN ---------- */
  #game { padding: 0; }
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 16px;
    color: var(--muted);
    font-size: 0.85rem;
  }
  .topbar button {
    background: none;
    border: 1px solid #333a52;
    color: var(--muted);
    border-radius: 10px;
    padding: 6px 12px;
    font-size: 0.8rem;
    cursor: pointer;
  }
  .card-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px 16px;
    min-height: 0;
  }
  .prompt-card {
    width: 100%;
    max-width: 480px;
    height: 100%;
    max-height: 100%;
    background: linear-gradient(160deg, #232842, #1a1e30);
    border: 1px solid #333a52;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 28px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0,0,0,0.45);
    position: relative;
    animation: dealIn 0.3s ease;
  }
  @keyframes dealIn {
    from { opacity: 0; transform: translateY(16px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  .card-eyebrow {
    font-size: 0.75rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent2);
    margin-bottom: 14px;
    font-weight: 700;
  }
  .card-text {
    font-size: clamp(1.4rem, 5.5vw, 2rem);
    font-weight: 800;
    line-height: 1.3;
  }
  .card-hint {
    position: absolute;
    bottom: 16px;
    color: var(--muted);
    font-size: 0.75rem;
  }
  .players-area {
    padding: 0 12px 16px;
  }
  .players-hint {
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    margin-bottom: 8px;
  }
  .players-grid {
    display: grid;
    gap: 8px;
  }
  .player-btn {
    border: none;
    border-radius: 16px;
    padding: 16px 8px;
    font-size: 1.05rem;
    font-weight: 700;
    color: white;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .player-btn:active { transform: scale(0.96); }
  .player-score {
    font-size: 0.8rem;
    font-weight: 600;
    opacity: 0.85;
  }
  /* ---------- WINNER SCREEN ---------- */
  #winner {
    justify-content: center;
    align-items: center;
    padding: 24px;
    gap: 20px;
    text-align: center;
  }
  .trophy { font-size: 4.5rem; }
  #winnerName { font-size: 2rem; font-weight: 800; }
  .winner-sub { color: var(--muted); }
  #finalScores {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 16px 28px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    font-size: 1rem;
  }
  .final-row { display: flex; justify-content: space-between; gap: 32px; }
  .winner-buttons { display: flex; gap: 12px; width: 100%; max-width: 400px; }
  .winner-buttons button {
    flex: 1;
    padding: 16px;
    border: none;
    border-radius: 14px;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  #playAgainBtn { background: linear-gradient(90deg, var(--accent), var(--accent2)); color: white; }
  #newGameBtn { background: var(--card-bg); color: var(--text); border: 1px solid #333a52; }
</style>
</head>
<body>

<!-- SETUP -->
<div id="setup" class="screen active">
  <div>
    <div class="logo">&#127925; AUX BATTLE</div>
    <div class="logo-sub">May the best song win.</div>
  </div>

  <div class="setup-group">
    <div class="setup-label">Players</div>
    <div class="pill-row" id="playerPills"></div>
  </div>

  <div class="setup-group">
    <div class="setup-label">Cards to Win</div>
    <div class="pill-row" id="winPills"></div>
  </div>

  <div class="setup-group">
    <div class="setup-label">Deck</div>
    <div class="pill-row" id="deckPills">
      <button class="pill deck-pill selected" data-deck="family">Family</button>
      <button class="pill deck-pill" data-deck="mix">Mix</button>
      <button class="pill deck-pill" data-deck="adult">Adult</button>
    </div>
  </div>

  <button id="startBtn">Start Game</button>
</div>

<!-- GAME -->
<div id="game" class="screen">
  <div class="topbar">
    <span id="deckStatus"></span>
    <span id="targetStatus"></span>
    <button id="skipBtn">Skip card</button>
  </div>
  <div class="card-area">
    <div class="prompt-card">
      <div class="card-eyebrow">Play a song...</div>
      <div class="card-text" id="cardText"></div>
      <div class="card-hint">Tap the winner below to deal the next card</div>
    </div>
  </div>
  <div class="players-area">
    <div class="players-grid" id="playersGrid"></div>
  </div>
</div>

<!-- WINNER -->
<div id="winner" class="screen">
  <div class="trophy">&#127942;</div>
  <div id="winnerName"></div>
  <div class="winner-sub">takes the crown!</div>
  <div id="finalScores"></div>
  <div class="winner-buttons">
    <button id="playAgainBtn">Play Again</button>
    <button id="newGameBtn">New Setup</button>
  </div>
</div>

<script>
// ============ PROMPT DECKS (original prompts) ============
const FAMILY_PROMPTS = [
  "...that instantly puts you in a good mood",
  "...for the opening scene of a summer road trip movie",
  "...that everyone in the car knows the words to",
  "...that would play while a superhero suits up",
  "...for dancing badly in the kitchen",
  "...that sounds like sunshine",
  "...you'd blast with the windows down",
  "...that belongs in a video game boss fight",
  "...for the last day of school",
  "...that would wake you up better than an alarm",
  "...you'd want playing when you walk into a room",
  "...that makes you feel like the main character",
  "...for a slow-motion walk away from an explosion",
  "...that a grandma and a teenager would both love",
  "...for a dog running in slow motion on a beach",
  "...that would make a great ringtone",
  "...to hype up a sports team before the big game",
  "...that sounds like it belongs in space",
  "...for jumping into a pool cannonball-style",
  "...that would play during a movie training montage",
  "...you'd sing at the top of your lungs",
  "...that makes long car rides go faster",
  "...for building the world's greatest blanket fort",
  "...that would make a baby stop crying",
  "...that feels like Friday afternoon",
  "...for a robot learning to dance",
  "...to play while making pancakes",
  "...that belongs in an old-timey cartoon",
  "...for the world's most epic water balloon fight",
  "...that would play when you win the lottery",
  "...you can't help but drum along to",
  "...for a rainy day inside",
  "...that sounds like autumn",
  "...to teleport you back to being a little kid",
  "...for a pirate ship setting sail",
  "...that would play in a movie about your life",
  "...for riding a roller coaster",
  "...that makes chores actually fun",
  "...you'd play to introduce an alien to Earth music",
  "...for a snowball fight championship",
  "...that sounds like the color yellow",
  "...for the world's slowest race",
  "...that could calm down an angry T-Rex",
  "...to play at the world's fanciest dinner party",
  "...that makes you want to learn the dance moves",
  "...for a montage of epic fails",
  "...that would play when the underdog finally wins",
  "...you'd want stuck in your head all day",
  "...for a hot air balloon ride",
  "...that feels like the first day of vacation",
  "...to soundtrack a squirrel heist movie",
  "...that would make traffic bearable",
  "...for a dance battle against a mirror",
  "...that belongs at a campfire",
  "...that sounds like it was made for stargazing",
  "...for sprinting through an airport",
  "...that could power a whole city with good vibes",
  "...you'd play for someone having a bad day",
  "...for a penguin waddling with purpose",
  "...that deserves to be in a car commercial",
  "...for opening presents on your birthday",
  "...that makes you feel unstoppable",
  "...to play while cleaning your room in 10 minutes flat",
  "...that would be the anthem of summer",
  "...for a cat plotting world domination",
  "...that everyone should hear at least once",
  "...for the moment the beat drops in a fireworks show",
  "...that sounds like a high five feels",
  "...you'd put on a mixtape for your best friend",
  "...for a llama in sunglasses",
  "...that would play during the game-winning shot",
  "...to end the perfect day",
];
const ADULT_PROMPTS = [
  "...for pretending to work while the boss walks by",
  "...that was your whole personality in high school",
  "...you secretly love but would never admit to",
  "...for dramatically quitting a job you hate",
  "...that belongs at a 2 a.m. karaoke bar",
  "...for texting your ex (don't do it)",
  "...that pairs perfectly with cheap wine",
  "...for strutting into your high school reunion",
  "...that was on every burned CD you made",
  "...for crying in the car (in a fun way)",
  "...that instantly makes you feel old",
  "...for when the group chat is popping off",
  "...you'd play at your villain origin story moment",
  "...for pregaming before a night you'll regret",
  "...that could end a marriage on the dance floor",
  "...for aggressively ignoring your responsibilities",
  "...that hits different after midnight",
  "...for a first date going suspiciously well",
  "...you'd want playing during a bar fight (movie version)",
  "...for surviving a family holiday dinner",
  "...that was definitely played at your prom",
  "...for rage-cleaning the entire house",
  "...that makes you think of a very specific summer",
  "...you'd slow dance to with a total stranger",
  "...for walking out of a bad haircut with confidence",
  "...that would play during your midlife crisis montage",
  "...for the walk of shame (or stride of pride)",
  "...that deserves a cigarette afterward",
  "...for online shopping at 1 a.m.",
  "...that you and your ex both claimed in the breakup",
  "...for when the babysitter finally arrives",
  "...that made you think you could sing",
  "...for day-drinking on a random Tuesday",
  "...you'd play to seduce someone (allegedly)",
  "...that belongs on a dive bar jukebox",
  "...for peeling out of the parking lot after your shift",
  "...that would play as you burn a bridge (metaphorically)",
  "...for the group vacation that almost broke the friendship",
  "...that turns 30-somethings feral on a dance floor",
  "...for hiding from your kids in the pantry",
];

// ============ STATE ============
let state = {
  numPlayers: 4,
  cardsToWin: 5,
  deck: "family",
  scores: [],
  drawPile: [],
  currentCard: null,
};

const PLAYER_COLORS = ["#7c5cff", "#ff5c8a", "#2ecc71", "#f39c12", "#3498db", "#e74c3c"];

// ============ SETUP UI ============
const playerPills = document.getElementById("playerPills");
for (let n = 2; n <= 6; n++) {
  const b = document.createElement("button");
  b.className = "pill" + (n === state.numPlayers ? " selected" : "");
  b.textContent = n;
  b.onclick = () => {
    state.numPlayers = n;
    [...playerPills.children].forEach(c => c.classList.toggle("selected", +c.textContent === n));
  };
  playerPills.appendChild(b);
}

const winPills = document.getElementById("winPills");
[3, 5, 7, 10].forEach(n => {
  const b = document.createElement("button");
  b.className = "pill" + (n === state.cardsToWin ? " selected" : "");
  b.textContent = n;
  b.onclick = () => {
    state.cardsToWin = n;
    [...winPills.children].forEach(c => c.classList.toggle("selected", +c.textContent === n));
  };
  winPills.appendChild(b);
});

document.getElementById("deckPills").addEventListener("click", e => {
  const btn = e.target.closest("[data-deck]");
  if (!btn) return;
  state.deck = btn.dataset.deck;
  [...document.querySelectorAll("#deckPills .pill")].forEach(c =>
    c.classList.toggle("selected", c === btn));
});

// ============ GAME LOGIC ============
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildDeck() {
  if (state.deck === "family") return shuffle(FAMILY_PROMPTS);
  if (state.deck === "adult") return shuffle(ADULT_PROMPTS);
  return shuffle([...FAMILY_PROMPTS, ...ADULT_PROMPTS]);
}

function showScreen(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function startGame() {
  state.scores = Array(state.numPlayers).fill(0);
  state.drawPile = buildDeck();
  buildPlayerButtons();
  document.getElementById("targetStatus").textContent = "First to " + state.cardsToWin + " wins";
  nextCard();
  showScreen("game");
}

function nextCard() {
  if (state.drawPile.length === 0) state.drawPile = buildDeck();
  state.currentCard = state.drawPile.pop();
  const cardEl = document.querySelector(".prompt-card");
  cardEl.style.animation = "none";
  void cardEl.offsetWidth; // restart animation
  cardEl.style.animation = "";
  document.getElementById("cardText").textContent = state.currentCard;
  document.getElementById("deckStatus").textContent = state.drawPile.length + " cards left";
}

function buildPlayerButtons() {
  const grid = document.getElementById("playersGrid");
  grid.innerHTML = "";
  grid.style.gridTemplateColumns = state.numPlayers <= 3 ? `repeat(${state.numPlayers}, 1fr)` : `repeat(${Math.ceil(state.numPlayers / 2)}, 1fr)`;
  for (let i = 0; i < state.numPlayers; i++) {
    const b = document.createElement("button");
    b.className = "player-btn";
    b.style.background = PLAYER_COLORS[i];
    b.innerHTML = `<span>Player ${i + 1}</span><span class="player-score" id="score-${i}">${state.scores[i]} 🏆</span>`;
    b.onclick = () => awardRound(i);
    grid.appendChild(b);
  }
}

function awardRound(playerIdx) {
  state.scores[playerIdx]++;
  document.getElementById("score-" + playerIdx).textContent = state.scores[playerIdx] + " 🏆";
  if (state.scores[playerIdx] >= state.cardsToWin) {
    showWinner(playerIdx);
  } else {
    nextCard();
  }
}

function showWinner(playerIdx) {
  document.getElementById("winnerName").textContent = "Player " + (playerIdx + 1);
  const scoresEl = document.getElementById("finalScores");
  scoresEl.innerHTML = state.scores
    .map((s, i) => ({ s, i }))
    .sort((a, b) => b.s - a.s)
    .map(({ s, i }) => `<div class="final-row"><span style="color:${PLAYER_COLORS[i]}">Player ${i + 1}</span><span>${s} 🏆</span></div>`)
    .join("");
  showScreen("winner");
}

document.getElementById("startBtn").onclick = startGame;
document.getElementById("skipBtn").onclick = nextCard;
document.getElementById("playAgainBtn").onclick = startGame;
document.getElementById("newGameBtn").onclick = () => showScreen("setup");
</script>
</body>
</html>
